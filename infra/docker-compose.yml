name: siteguard
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: siteguard
      POSTGRES_PASSWORD: siteguard
      POSTGRES_DB: siteguard
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siteguard"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
  redisdata:
